name: Post to Instagram

on:
  schedule:
    - cron: "*/10 * * * *"   # check every 10 min; the script decides if a post is due
  workflow_dispatch:
    inputs:
      mode:
        description: "tick | check | dry-run"
        default: "check"

concurrency:
  group: instagram-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run poster
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_QUEUE_FOLDER_ID: ${{ vars.DRIVE_QUEUE_FOLDER_ID }}
          DRIVE_POSTED_FOLDER_ID: ${{ vars.DRIVE_POSTED_FOLDER_ID }}
          DRIVE_FAILED_FOLDER_ID: ${{ vars.DRIVE_FAILED_FOLDER_ID }}
          POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          ACTIVE_START_HOUR: ${{ vars.ACTIVE_START_HOUR }}
          ACTIVE_END_HOUR: ${{ vars.ACTIVE_END_HOUR }}
          DEFAULT_CAPTION: ${{ vars.DEFAULT_CAPTION }}
          SHARE_TO_FEED: ${{ vars.SHARE_TO_FEED }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
        run: |
          MODE="${{ github.event.inputs.mode || 'tick' }}"
          case "$MODE" in
            check)   python poster.py --check ;;
            dry-run) python poster.py --dry-run ;;
            *)       python poster.py ;;
          esac
