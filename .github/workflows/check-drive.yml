name: Test Google Drive access

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python poster.py --check-drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_QUEUE_FOLDER_ID: ${{ vars.DRIVE_QUEUE_FOLDER_ID }}
          DRIVE_POSTED_FOLDER_ID: ${{ vars.DRIVE_POSTED_FOLDER_ID }}
          DRIVE_FAILED_FOLDER_ID: ${{ vars.DRIVE_FAILED_FOLDER_ID }}
