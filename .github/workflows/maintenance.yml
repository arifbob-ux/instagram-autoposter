name: Weekly keep-alive

# GitHub auto-disables scheduled workflows after 60 days without repo activity.
# This tiny weekly commit prevents that. (The Instagram system-user token never
# expires, so no token refresh is needed.)

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep-alive commit
        run: |
          date -u > .keepalive
          git config user.name "autoposter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" && git push || echo "nothing to commit"
